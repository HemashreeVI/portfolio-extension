# Publishes a GitHub release with a ready-to-install zip.
# To release: bump "version" in manifest.json and commit, then either
#   - Actions → Release → Run workflow (it tags main as v<version>), or
#   - git tag v1.1.0 && git push origin v1.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version from manifest.json
        run: |
          v=v$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json says $v but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          echo "TAG=$v" >> "$GITHUB_ENV"
      - name: Build the zip (only the files Chrome needs)
        run: zip -qr "nova-launchpad-$TAG.zip" . -x '.git/*' '.github/*' 'docs/*' '*.md' '.gitignore'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          1. Download the **.zip** file under Assets below and unzip it.
          2. Open `chrome://extensions`, turn on **Developer mode** (top right).
          3. Click **Load unpacked** and choose the unzipped folder.
          4. Open a new tab: Nova Launchpad replaces the new tab page.

          See the [README](https://github.com/${{ github.repository }}#readme) for what it does and how it works.
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" "nova-launchpad-$TAG.zip" --title "Nova Launchpad $TAG" --notes-file notes.md
